{% extends "base.html" %}

{% block content %}

<h1>Delete Course</h1>

<p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'course_list' %}">Cancel</a>
</form>

{% endblock %}

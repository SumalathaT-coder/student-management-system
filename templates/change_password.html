{% extends "base.html" %}

{% block content %}

<h1>Change Password</h1>

<form method="POST">

    {% csrf_token %}

    <label>Current Password</label>
    <input
        type="password"
        name="old_password"
        required
    >

    <label>New Password</label>
    <input
        type="password"
        name="new_password"
        required
    >

    <label>Confirm New Password</label>
    <input
        type="password"
        name="confirm_password"
        required
    >

    <button type="submit">
        Change Password
    </button>

</form>

<a href="{% url 'profile' %}" class="action-btn">
    Cancel
</a>

{% endblock %}

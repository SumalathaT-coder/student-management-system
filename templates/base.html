{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}?v=3"
    >

</head>

<body>

    {% include "includes/nav.html" %}


    {% if messages %}

        {% for message in messages %}

            <p class="success-message">
                {{ message }}
            </p>

        {% endfor %}

    {% endif %}


    {% block content %}
    {% endblock %}


    

    <script src="{% static 'js/main.js' %}"></script>


</body>

</html>
